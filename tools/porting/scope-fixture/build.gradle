// A separate, bounded integration test mod. This does NOT build or launch the full TACZ mod.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
version = '1.0'
group = 'com.tacz.porting'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
def repo = file('../../..')
def scopeMixins = ['ScopeFeatureDispatcherMixin', 'ScopeSimplePhaseMixin', 'ScopeTranslucentPhaseMixin']
sourceSets.main.java {
    srcDir new File(repo, 'src/main/java')
    include 'com/tacz/guns/porting/scopefixture/**'
    include 'com/tacz/guns/client/renderer/scope/**'
    include 'com/tacz/guns/client/renderer/VertexCapture.java'
    include 'com/tacz/guns/client/renderer/RenderSubmission.java'
    scopeMixins.each { include "com/tacz/guns/mixin/client/${it}.java" }
}
// Use the real production AT, and derive the test config from the production manifest.
// No copied or substituted renderer/Mixin implementation can drift from main sources.
def generatedResources = layout.buildDirectory.dir('generated/fixtureResources')
def generateFixtureResources = tasks.register('generateFixtureResources') {
    inputs.files(new File(repo, 'src/main/resources/tacz.mixins.json'), new File(repo, 'src/main/resources/META-INF/accesstransformer.cfg'))
    outputs.dir generatedResources
    doLast {
        def config = new groovy.json.JsonSlurper().parse(new File(repo, 'src/main/resources/tacz.mixins.json'))
        def selected = scopeMixins.collect { "client.${it}".toString() }
        assert config.required && config.injectors.defaultRequire == 1 && config.client.containsAll(selected)
        config.client = selected
        config.mixins = []
        def output = generatedResources.get().asFile
        output.mkdirs()
        new File(output, 'scope-fixture.mixins.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
        copy { from new File(repo, 'src/main/resources/META-INF/accesstransformer.cfg'); into new File(output, 'META-INF') }
    }
}
sourceSets.main.resources.srcDir generatedResources
minecraft {
    accessTransformers = files(new File(repo, 'src/main/resources/META-INF/accesstransformer.cfg'))
    runs {
        register('client') {
            workingDir = layout.projectDirectory.dir('run')
            args '--username', 'ScopeFixture', '--mixin.config=scope-fixture.mixins.json', '--width', '640', '--height', '360'
            if (providers.gradleProperty('fixtureGraphicsBackend').isPresent()) {
                args '--graphicsBackend', providers.gradleProperty('fixtureGraphicsBackend').get()
            }
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'mixin.debug.export', 'true'
            systemProperty 'mixin.debug.countInjections', 'true'
        }
    }
}
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven; mavenCentral() }
dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.1.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}
tasks.named('processResources') { dependsOn generateFixtureResources }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { manifest.attributes('MixinConfigs': 'scope-fixture.mixins.json') }
tasks.register('verifyScopeFml') {
    group = 'verification'
    description = 'Launches a separate Forge client fixture, checks production scope Mixins and stops; not a TACZ launch.'
    dependsOn 'runClient'
    doLast {
        def result = file('run/scope-fixture-result.json')
        if (!result.exists()) throw new GradleException('Client exited without scope fixture results')
        def data = new groovy.json.JsonSlurper().parse(result)
        if (data.status != 'passed') throw new GradleException("Scope fixture failed: ${data}")
        def requested = providers.gradleProperty('fixtureGraphicsBackend').orElse('DEFAULT').get().toUpperCase(Locale.ROOT)
        if (requested != 'DEFAULT' && data.backend.toUpperCase(Locale.ROOT) != requested) {
            throw new GradleException("Client fell back from requested ${requested} to ${data.backend}")
        }
        logger.lifecycle("Scope FML fixture passed ${data.assertions} assertions")
    }
}
tasks.matching { it.name == 'runClient' }.configureEach {
    timeout = java.time.Duration.ofMinutes(6)
    doFirst {
        // Remove only this test's stale result; a crash must never inherit an old success.
        file('run/scope-fixture-result.json').delete()
        def digest = { File input ->
            def hash = java.security.MessageDigest.getInstance('SHA-256')
            input.withInputStream { stream ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = stream.read(buffer)) != -1) hash.update(buffer, 0, count)
            }
            hash.digest().encodeHex().toString()
        }
        def inputs = new LinkedHashSet<File>(tasks.named('compileJava').get().source.files)
        inputs.addAll(sourceSets.main.resources.files)
        inputs.addAll([file('build.gradle'), file('settings.gradle'), file('gradle.properties'),
                new File(repo, 'src/main/resources/tacz.mixins.json'), new File(repo, 'src/main/resources/META-INF/accesstransformer.cfg'),
                new File(repo, 'gradlew.bat'), new File(repo, 'gradle/wrapper/gradle-wrapper.properties'), new File(repo, 'gradle/wrapper/gradle-wrapper.jar')])
        def sources = inputs.sort { it.absolutePath }.collectEntries { [(repo.toPath().toAbsolutePath().normalize().relativize(it.toPath().toAbsolutePath().normalize()).toString().replace('\\', '/')): digest(it)] }
        def dependencies = sourceSets.main.runtimeClasspath.files.findAll { it.isFile() }.sort { it.absolutePath }
                .collectEntries { [(it.absolutePath): digest(it)] }
        def data = [scope: 'separate Forge client fixture, not TACZ', started: java.time.Instant.now().toString(),
                requestedBackend: providers.gradleProperty('fixtureGraphicsBackend').orElse('default').get(),
                input_sha256: sources, runtime_classpath_sha256: dependencies]
        file('run').mkdirs()
        file('run/scope-fixture-inputs.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
    }
}
