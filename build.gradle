dependencies { portingChecksAnnotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5' }
tasks.register('verifyPortingEvents', JavaExec) {
    group = 'verification'
    description = 'Checks actual migrated TACZ events on EventBus 7; does not launch TACZ or KubeJS.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.EventChecks'
    systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.register('verifyPortingNetwork', JavaExec) {
    group = 'verification'
