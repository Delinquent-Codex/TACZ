// Offscreen verification only; matches the pinned Minecraft 26.2 LWJGL runtime.
configurations { portingGpuNatives }
def gpuOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def gpuArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def gpuNativeClassifier = gpuOs.contains('win') ? 'natives-windows' : gpuOs.contains('mac') ? 'natives-macos' : 'natives-linux'
if (gpuArch in ['aarch64', 'arm64']) gpuNativeClassifier += '-arm64'
dependencies {
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-jemalloc', 'lwjgl-stb', 'lwjgl-vma', 'lwjgl-shaderc', 'lwjgl-spvc', 'lwjgl-openal', 'lwjgl-tinyfd', 'lwjgl-freetype'].each { module ->
        portingGpuNatives "org.lwjgl:${module}:3.4.1:${gpuNativeClassifier}"
    }
}

tasks.register('verifyPortingScopeGpu', JavaExec) {
    group = 'verification'
    description = 'Runs native OpenGL scope passes in a hidden window and checks texture readback; no Minecraft/FML.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    classpath = sourceSets.portingChecks.runtimeClasspath
    classpath += configurations.portingGpuNatives
    mainClass = 'com.tacz.guns.porting.ScopeGpuChecks'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}


tasks.register('verifyPortingScopeVulkan', JavaExec) {
    group = 'verification'
    description = 'Runs native Vulkan scope passes in a hidden window and checks texture readback; no Minecraft/FML.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    classpath = sourceSets.portingChecks.runtimeClasspath + configurations.portingGpuNatives
    mainClass = 'com.tacz.guns.porting.ScopeGpuChecks'
    args '--vulkan'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}


tasks.register('verifyPortingScopeNative', JavaExec) {
    group = 'verification'
    description = 'Checks target feature geometry builders inside scope capture; no FML or asset/atlas bake.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.ScopeNativeChecks'
}

// Mavenizer downloads this original client archive while resolving the pinned target. The
// tests read its GLSL directly; a path override accommodates alternate Gradle cache layouts.
def portingClientAssets = providers.gradleProperty('portingClientAssets').orElse(
        new File(gradle.gradleUserHomeDir, "caches/minecraftforge/forgegradle/mavenizer/caches/minecraft_tasks/${minecraft_version}/client.jar").absolutePath)
['verifyPortingScopeGpu', 'verifyPortingScopeVulkan'].each { name ->
    tasks.named(name, JavaExec) {
        systemProperty 'porting.clientAssets', portingClientAssets.get()
        inputs.file(portingClientAssets)
    }
}
