tasks.register('verifyPortingFirstPerson', JavaExec) {
    group = 'verification'
    description = 'Checks first-person item switching and the real MAE library; no live rendering.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.FirstPersonChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('verifyPortingGeometry', JavaExec) {
    group = 'verification'
    description = 'Checks actual bedrock vertex output and immutable submissions; no GPU rendering.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.GeometryChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('verifyPortingItemModels', JavaExec) {
    group = 'verification'
    description = 'Checks target item-model codecs, resource mappings and dye tint; no model bake or rendering.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.ItemModelChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
