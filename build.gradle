plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.36'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}
group = 'com.tacz'
version = mod_version
base.archivesName = "tacz-${minecraft_version}"
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
sourceSets.main.resources.srcDir 'src/generated/resources'
minecraft {
    // 26.2 ships named classes; no SRG reobfuscation or Parchment layer.
    accessTransformer = true
    runs {
        configureEach {
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'tacz'
            args '--mixin.config=tacz.mixins.json', '--mixin.config=tacz.compat.acceleratedrendering.mixins.json'
        }
        register('client') {
            workingDir = layout.projectDirectory.dir(providers.gradleProperty('clientRunDirectory').orElse('run/client_a').get())
            args '--username', providers.gradleProperty('clientUsername').orElse('TaczShooter').get()
        }
        register('server') {
            workingDir = layout.projectDirectory.dir('run/server')
            args '--nogui'
        }
        register('gameTestServer') { workingDir = layout.projectDirectory.dir('run/gametest') }
        register('data') {
            workingDir = layout.projectDirectory.dir('run/data')
            args '--mod', 'tacz', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods'; includeGroup 'dev.latvian.apps' }
    }
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.FiguraMC.luaj' }
    }
    flatDir { dirs 'libs' }
}
jarJar.register()
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('jarJar') { archiveClassifier = '' }
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
    implementation('com.maydaymemory:mae:1.1.2') {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }
    jarJar('com.maydaymemory:mae:1.1.2') {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    jarJar 'org.apache.commons:commons-math3:3.6.1'
    ['luaj-core', 'luaj-jse'].each { module ->
        implementation("com.github.FiguraMC.luaj:${module}:3.0.8-figura") { exclude group: 'org.apache.commons', module: 'commons-lang3' }
        jarJar("com.github.FiguraMC.luaj:${module}:3.0.8-figura") { exclude group: 'org.apache.commons', module: 'commons-lang3' }
    }
    implementation('org.apache.bcel:bcel:6.6.1') { exclude group: 'org.apache.commons', module: 'commons-lang3' }
    jarJar('org.apache.bcel:bcel:6.6.1') { exclude group: 'org.apache.commons', module: 'commons-lang3' }
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.4'))
    implementation 'io.github.llamalad7:mixinextras-forge:0.5.4'
    jarJar 'io.github.llamalad7:mixinextras-forge:0.5.4'
}
// Temporary migration signatures, not verified runtime dependencies.
// Every original integration source remains compiled. See dependencies.md.
apply from: 'gradle/legacy-dependencies.gradle'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Title': 'Timeless & Classics Guns: Zero', 'Implementation-Version': project.version,
        'MixinConfigs': 'tacz.mixins.json,tacz.compat.acceleratedrendering.mixins.json')
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') { expand(mod_version: project.version) }
}

// Focused tests compile the actual ported primitives against the target game.
// This task never builds the mod and cannot satisfy the full build/runtime gates.
sourceSets {
    portingChecks {
        java.srcDirs 'src/portingChecks/java', 'src/main/java'
        java.include 'com/tacz/guns/porting/PrimitiveChecks.java'
        java.include 'com/tacz/guns/porting/EventChecks.java'
        java.include 'com/tacz/guns/porting/NetworkChecks.java'
        java.include 'com/tacz/guns/porting/ContentChecks.java'
        java.include 'com/tacz/guns/porting/CraftingChecks.java'
        java.include 'com/tacz/guns/porting/PackChecks.java'
        java.include 'com/tacz/guns/porting/LuaChecks.java'
        java.include 'com/tacz/guns/porting/StoredDataChecks.java'
        java.include 'com/tacz/guns/porting/DyeChecks.java'
        java.include 'com/tacz/guns/porting/ProjectileDataChecks.java'
        java.include 'com/tacz/guns/porting/ExplosionChecks.java'
        java.include 'com/tacz/guns/porting/FirstPersonChecks.java'
        java.include 'com/tacz/guns/porting/GeometryChecks.java'
        java.include 'com/tacz/guns/porting/ItemModelChecks.java'
        java.include 'com/tacz/guns/client/renderer/item/TaczItemModel.java'
        java.include 'com/tacz/guns/api/client/renderer/TaczItemRenderer.java'
        java.include 'com/tacz/guns/api/client/renderer/TaczClientItemExtensions.java'
        java.include 'com/tacz/guns/client/renderer/VertexCapture.java'
        java.include 'com/tacz/guns/client/renderer/RenderSubmission.java'
        java.include 'com/tacz/guns/client/model/bedrock/BedrockCube.java'
        java.include 'com/tacz/guns/client/model/bedrock/BedrockCubeBox.java'
        java.include 'com/tacz/guns/client/model/bedrock/BedrockCubePerFace.java'
        java.include 'com/tacz/guns/client/model/bedrock/BedrockPolygon.java'
        java.include 'com/tacz/guns/client/model/bedrock/BedrockVertex.java'
        java.include 'com/tacz/guns/client/resource/pojo/model/FaceUVsItem.java'
        java.include 'com/tacz/guns/client/resource/pojo/model/FaceItem.java'
        java.include 'com/tacz/guns/api/client/animation/IFPAnimationInstance.java'
        java.include 'com/tacz/guns/client/animation/FirstPersonItemState.java'
        java.include 'com/tacz/guns/util/block/ExplosionExposure.java'
        java.include 'com/tacz/guns/entity/BulletSpawnData.java'
        java.include 'com/tacz/guns/entity/TracerData.java'
        java.include 'com/tacz/guns/api/item/nbt/StoredItemData.java'
        java.include 'com/tacz/guns/item/GunTooltipPart.java'
        java.include 'com/tacz/guns/api/util/LegacyProfileData.java'
        java.include 'com/tacz/guns/api/util/LegacyComponentData.java'
        java.include 'com/tacz/guns/api/util/LuaNbtAccessor.java'
        java.include 'com/tacz/guns/resource/LegacyRecipePackResources.java'
        java.include 'net/minecraftforge/registries/PortingRegistryFixture.java'
        java.include 'com/tacz/guns/crafting/GunSmithTableIngredient.java'
        java.include 'com/tacz/guns/crafting/GunSmithTableInput.java'
        java.include 'com/tacz/guns/crafting/IngredientAllocation.java'
        java.include 'com/tacz/guns/crafting/CraftingOutputs.java'
        java.include 'com/tacz/guns/resource/serialize/LegacyPackCodecs.java'
        java.include 'com/tacz/guns/api/TaczConstants.java'
        java.include 'com/tacz/guns/api/DefaultAssets.java'
        java.include 'com/tacz/guns/init/ModParticles.java'
        java.include 'com/tacz/guns/init/ModPainting.java'
        java.include 'com/tacz/guns/particles/BulletHoleOption.java'
        java.include 'com/tacz/guns/porting/RegistryFixture.java'
        java.include 'com/tacz/guns/network/SyncedDataMapping.java'
        java.include 'com/tacz/guns/entity/sync/core/IDataSerializer.java'
        java.include 'com/tacz/guns/entity/sync/core/Serializers.java'
        java.include 'com/tacz/guns/entity/sync/ModSerializers.java'
        java.include 'com/tacz/guns/api/entity/ReloadState.java'
        java.include 'com/tacz/guns/network/message/event/*.java'
        java.include 'com/tacz/guns/api/event/GunEvent.java'
        java.include 'com/tacz/guns/api/event/common/Gun*Event.java'
        java.include 'com/tacz/guns/api/event/common/GunDamageSourcePart.java'
        java.include 'com/tacz/guns/api/event/common/Entity*Event.java'
        java.include 'com/tacz/guns/api/event/common/KubeJSGunEventPoster.java'
        java.include 'com/tacz/guns/api/client/event/*.java'
        java.include 'com/tacz/guns/resource/serialize/IdentifierSerializer.java'
        java.include 'com/tacz/guns/api/item/nbt/ItemDataAccessor.java'
        java.include 'com/tacz/guns/api/item/nbt/GunAttachmentData.java'
        java.include 'com/tacz/guns/api/item/attachment/AttachmentType.java'
        java.include 'com/tacz/guns/init/ModDataComponents.java'
        compileClasspath = sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}
dependencies { portingChecksAnnotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5' }
tasks.register('verifyPortingEvents', JavaExec) {
    group = 'verification'
    description = 'Checks actual migrated TACZ events on EventBus 7; does not launch TACZ or KubeJS.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.EventChecks'
    systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.register('verifyPortingNetwork', JavaExec) {
    group = 'verification'
    description = 'Checks target mapping and gun-event packet codecs; no live connection or gameplay.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.NetworkChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.register('verifyPortingPrimitives', JavaExec) {
    group = 'verification'
    description = 'Checks target identifier and item-data primitives; does not build or launch TACZ.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.PrimitiveChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.register('verifyPortingContent', JavaExec) {
    group = 'verification'
    description = 'Checks target particle and painting data codecs; does not verify FML registration or rendering.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.ContentChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.register('verifyPortingCrafting', JavaExec) {
    group = 'verification'
    description = 'Checks legacy pack codecs and material allocation; no live menu or recipe reload.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.CraftingChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.register('verifyPortingPacks', JavaExec) {
    group = 'verification'
    description = 'Checks actual target folder/ZIP recipe resources; no full gun-pack reload or rendering.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.PackChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.register('verifyPortingLua', JavaExec) {
    group = 'verification'
    description = 'Runs LuaJ scripts against actual component-backed NBT access; no gun gameplay.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.LuaChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.register('verifyPortingStoredData', JavaExec) {
    group = 'verification'
    description = 'Checks nested saved-item, target-owner and name migration with real target ValueInput/ValueOutput.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.StoredDataChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('verifyPortingDye', JavaExec) {
    group = 'verification'
    description = 'Checks the shipped ammo-box dye recipe using a real target recipe and a plain registry fixture item.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.DyeChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('verifyPortingProjectileData', JavaExec) {
    group = 'verification'
    description = 'Checks projectile spawn wire layout and tracer overrides; no live entity or rendering.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.ProjectileDataChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('verifyPortingExplosions', JavaExec) {
    group = 'verification'
    description = 'Checks TACZ explosion cover samples and falloff; no live world or damage.'
    dependsOn tasks.named('compilePortingChecksJava')
    classpath = sourceSets.portingChecks.runtimeClasspath
    mainClass = 'com.tacz.guns.porting.ExplosionChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
